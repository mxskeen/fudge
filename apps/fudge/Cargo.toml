[package]
name = "fudge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Fudge Launcher: GTK4 front end"

[[bin]]
name = "fudge"
path = "src/main.rs"

[features]
default = []
# Wayland layer-shell overlay (needs libgtk4-layer-shell at build and run time).
layer-shell = ["dep:gtk4-layer-shell"]

[dependencies]
fudge-core.workspace = true
fudge-providers.workspace = true
fudge-platform.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
dirs.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
gtk4 = { version = "0.9", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
gtk4-layer-shell = { version = "0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
gdk4-x11 = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.6"
