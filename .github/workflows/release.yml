name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libsqlite3-dev libx11-dev libxcb1-dev
      - run: cargo test --workspace
      - run: cargo build --release -p fudge
      - name: Package
        run: packaging/build-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --latest \
            --title "Fudge $GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md
