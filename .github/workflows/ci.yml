name: CI
on: [push, pull_request]
jobs:
  compute:
    name: fudge-compute (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p fudge-compute -p fudge-core
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev libsqlite3-dev libx11-dev libxcb1-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
